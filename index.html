<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mzansi Flow PMS System</title>
    <meta name="description" content="A multi-tenant performance management system for South African municipalities with IPMS, Organogram, and SDBIP." />
    <meta property="og:title" content="Mzansi Flow PMS System" />
    <meta property="og:description" content="A multi-tenant performance management system for South African municipalities with IPMS, Organogram, and SDBIP." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function () {
        if (typeof window === 'undefined' || !window.WebSocket) return;
        var NativeWebSocket = window.WebSocket;
        function PatchedWebSocket(url, protocols) {
          var isViteHmr =
            protocols === 'vite-hmr' ||
            protocols === 'vite-ping' ||
            (Array.isArray(protocols) && (protocols.indexOf('vite-hmr') !== -1 || protocols.indexOf('vite-ping') !== -1));
          if (isViteHmr) {
            var target = new EventTarget();
            target.url = String(url || '');
            target.readyState = 1;
            target.OPEN = 1;
            target.CONNECTING = 0;
            target.CLOSING = 2;
            target.CLOSED = 3;
            target.protocol = typeof protocols === 'string' ? protocols : 'vite-hmr';
            target.extensions = '';
            target.bufferedAmount = 0;
            target.binaryType = 'blob';
            target.send = function () {};
            target.close = function () {
              target.readyState = 3;
            };
            return target;
          }
          return protocols !== undefined
            ? new NativeWebSocket(url, protocols)
            : new NativeWebSocket(url);
        }
        PatchedWebSocket.prototype = NativeWebSocket.prototype;
        PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
        PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
        PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
        PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
        window.WebSocket = PatchedWebSocket;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
