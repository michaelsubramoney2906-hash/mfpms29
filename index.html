<!doctype html>

    <meta charset="UTF-8" />
    <script>
      (function() {
        function isViteWsError(err) {
          if (!err) return false;
          var msg = (typeof err === 'string' ? err : (err.message || err.toString() || ''));
          var stack = (err && err.stack) || '';
          return msg.indexOf('WebSocket') !== -1 || stack.indexOf('@vite/client') !== -1 || msg.indexOf('vite:ws') !== -1 || stack.indexOf('createWebSocketModuleRunnerTransport') !== -1;
        }
        window.addEventListener('unhandledrejection', function(e) {
          if (isViteWsError(e.reason)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(e) {
          if (isViteWsError(e.error) || (e.message && isViteWsError(e.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
